  <!-- Nepal: drawn on the 9x11 icon grid as Mark James drew his. The top is cut flat, three pixels wide, both
       pennants step one pixel a row (a 45 degree edge half a pixel off the grid, so each row ends on a nearly
       whole pixel), the upper pennant is a pixel shorter than the lower, and the border is one pixel wide along
       every row, which leaves the crimson its sharp inner corner and two pixels of field beside it. The crimson
       path is the catalog's "inset", where the frame ends. Moon and sun sit where his do, on one axis. -->
