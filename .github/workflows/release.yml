# On a version tag: render PNGs, run the checks, attach dist as a zip.
name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run png
      - run: cp LICENSE dist/ && cd dist && zip -qr ../famfamfam-flags-svg.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: famfamfam-flags-svg.zip
          body_path: .github/release-notes.md
