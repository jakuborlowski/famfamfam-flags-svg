<!doctype html>
<!-- famfamfam-flags-svg in an email. Gmail (which converts SVG to PNG),
     Outlook 2019 and later, Outlook.com and Apple Mail show the SVGs. Give
     both width and height, since clients ignore CSS sizes: 11 wide for ch,
     9 for np. Outlook 2016 and older and Mail.ru don't show SVG; to reach
     them, host the PNGs from the release zip yourself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order has shipped</title>
</head>
<body>
<main>
<h1>Your order has shipped</h1>
<p>
  Shipping to
  <img src="https://cdn.jsdelivr.net/npm/famfamfam-flags-svg@0.2.0/dist/svg/pl.svg" width="16" height="11" alt=""> Poland,
  from
  <img src="https://cdn.jsdelivr.net/npm/famfamfam-flags-svg@0.2.0/dist/svg/ch.svg" width="11" height="11" alt=""> Switzerland.
</p>
<p>
  Delivered in
  <img src="https://cdn.jsdelivr.net/npm/famfamfam-flags-svg@0.2.0/dist/svg/pl.svg" width="16" height="11" alt="Poland">
  by our partner in
  <img src="https://cdn.jsdelivr.net/npm/famfamfam-flags-svg@0.2.0/dist/svg/np.svg" width="9" height="11" alt="Nepal">.
</p>
</main>
</body>
</html>
